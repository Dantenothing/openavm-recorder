name: Android release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run release gates
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
